# One Cache-Me-Outside node for a machine that will join other hosts.
# Start with: ./up.sh node
# Required: CMO_ANNOUNCE_IP is an address the other machines can reach.
# up.sh refuses 0.0.0.0, ::, and *. The host publish address is CMO_BIND_ADDRESS
# and defaults to 127.0.0.1. Set it to that same reachable address when clients
# and peers are not on this host.
#
# Keep the published client and bus ports equal to the ports inside the
# container (CMO_PORT and CMO_PORT+10000) unless you also set CMO_ANNOUNCE_PORT
# and CMO_ANNOUNCE_BUS_PORT to the published ports.

name: cache-me-outside

services:
  cmo-node:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cache-me-outside:local
    container_name: cmo-node
    hostname: cmo-node
    env_file:
      - path: ${CMO_ENV_FILE:-.env}
        required: false
    environment:
      CMO_ROLE: ${CMO_ROLE:-cluster}
      CMO_CLUSTER_ENABLED: ${CMO_CLUSTER_ENABLED:-yes}
      CMO_PORT: ${CMO_PORT:-6379}
      CMO_ANNOUNCE_IP: ${CMO_ANNOUNCE_IP:-}
      CMO_ANNOUNCE_PORT: ${CMO_ANNOUNCE_PORT:-${CMO_HOST_PORT:-6379}}
      CMO_ANNOUNCE_BUS_PORT: ${CMO_ANNOUNCE_BUS_PORT:-${CMO_BUS_HOST_PORT:-16379}}
      CMO_PRIMARY_HOST: ${CMO_PRIMARY_HOST:-}
      CMO_PRIMARY_PORT: ${CMO_PRIMARY_PORT:-6379}
      CMO_MAXMEMORY: ${CMO_MAXMEMORY:-256mb}
      CMO_MAXMEMORY_POLICY: ${CMO_MAXMEMORY_POLICY:-allkeys-lru}
      CMO_IO_THREADS: ${CMO_IO_THREADS:-1}
    ports:
      - "${CMO_BIND_ADDRESS:-127.0.0.1}:${CMO_HOST_PORT:-6379}:${CMO_PORT:-6379}"
      - "${CMO_BIND_ADDRESS:-127.0.0.1}:${CMO_BUS_HOST_PORT:-16379}:16379"
    volumes:
      - cmo-node-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CMO_CONTAINER_MEMORY:-512m}
    cpus: "${CMO_CPUS:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cmo-node-data:
    name: cmo-node-data
