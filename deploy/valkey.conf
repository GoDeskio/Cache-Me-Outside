# Cache-Me-Outside single-node config.
# Secrets are not stored here. The entrypoint writes an ACL file from the
# container environment and the server loads it via `aclfile`.
#
# Inside the container the server listens on every interface so Docker port
# publishing and an optional proxy-net attachment can reach it. Host exposure
# is set by deploy/docker-compose.yml and defaults to 127.0.0.1, never 0.0.0.0.

bind 0.0.0.0 -::*
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""
always-show-logo no

databases 16
dir /data
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# Point-in-time snapshots plus an AOF fsynced every second.
save 3600 1
save 300 100
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# Cache defaults. The entrypoint overrides these from the environment.
maxmemory 256mb
maxmemory-policy allkeys-lru

aclfile /tmp/cmo-users.acl
acl-pubsub-default resetchannels
