# Optional: attach the cache to an external Docker network named proxy-net
# so other containers can reach it by a project-specific alias.
#
# The alias defaults to cache-me-outside. Set CMO_NETWORK_ALIAS to change it.
# Do not use redis or valkey: those names are generic and will steal DNS from
# another stack on the same network. deploy/up.sh rejects them.
#
# The network must already exist. This file is not applied by deploy/up.sh.
#
#   docker network create proxy-net
#   docker compose -f docker-compose.yml -f docker-compose.proxy-net.yml up -d

services:
  cache-me-outside:
    networks:
      proxy-net:
        aliases:
          - ${CMO_NETWORK_ALIAS:-cache-me-outside}

networks:
  proxy-net:
    external: true
    name: proxy-net
