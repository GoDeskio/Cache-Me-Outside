apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cmo.dataPodPrefix" . }}
  labels:
    {{- include "cmo.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cmo.selector" (merge (dict "component" "data") .) | nindent 6 }}
{{- if eq .Values.topology "sentinel" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cmo.fullname" . }}-sentinel
  labels:
    {{- include "cmo.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cmo.selector" (merge (dict "component" "sentinel") .) | nindent 6 }}
{{- end }}
