{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.exporter.enabled }}
{{- fail "metrics.serviceMonitor.enabled requires metrics.exporter.enabled" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cmo.fullname" . }}
  labels:
    {{- include "cmo.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cmo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      cache-me-outside.io/metrics: "true"
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
