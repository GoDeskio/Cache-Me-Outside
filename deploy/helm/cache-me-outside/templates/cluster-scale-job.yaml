{{- if and (eq .Values.topology "cluster") .Values.cluster.scaleJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cmo.fullname" . }}-cluster-scale-{{ .Values.cluster.scaleJob.ordinal }}
  labels:
    {{- include "cmo.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "cmo.labels" . | nindent 8 }}
        app.kubernetes.io/component: cluster-scale
    spec:
      serviceAccountName: {{ include "cmo.fullname" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "cmo.podSecurity" . | nindent 8 }}
      containers:
        - name: scale
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "cmo.containerSecurity" . | nindent 12 }}
          command: ["/bin/sh", "/scripts/scale.sh"]
          env:
            {{- include "cmo.authEnv" . | nindent 12 }}
            - name: CMO_SCALE_ORDINAL
              value: {{ .Values.cluster.scaleJob.ordinal | quote }}
            - name: CMO_SCALE_ROLE
              value: {{ .Values.cluster.scaleJob.role | quote }}
            - name: CMO_SCALE_PRIMARY_ORDINAL
              value: {{ .Values.cluster.scaleJob.primaryOrdinal | quote }}
            - name: CMO_NODE_PREFIX
              value: {{ include "cmo.dataPodPrefix" . | quote }}
            - name: CMO_HEADLESS_SERVICE
              value: {{ include "cmo.headless" . | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ include "cmo.fullname" . }}-cluster-scripts
            defaultMode: 0555
{{- end }}
