# topology: standalone, sentinel, or cluster.
topology: standalone

image:
  repository: cache-me-outside
  tag: local
  pullPolicy: IfNotPresent

# Create the Secret out of band. This chart does not generate passwords.
#   kubectl create secret generic cache-me-outside-auth \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<16+ chars>' \
#     --from-literal=app-user=app \
#     --from-literal=app-password='<different 16+ chars>'
auth:
  existingSecret: cache-me-outside-auth
  adminUserKey: admin-user
  adminPasswordKey: admin-password
  appUserKey: app-user
  appPasswordKey: app-password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Keep maxmemory at or below half the memory limit. Forked rewrites need the rest.
maxmemory: 256mb
maxmemoryPolicy: allkeys-lru
# 1 uses the main thread only. Raise it only when a core is busy and at least
# one core is left for the rest of the node.
ioThreads: 1

persistence:
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""

# Host ports are off. Turning them on publishes on one address, never every NIC.
hostPort:
  enabled: false
  address: 127.0.0.1
  clientPort: 6379

sentinel:
  # Data replicas in addition to the initial primary (pod 0).
  replicas: 2
  count: 3
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 60000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

cluster:
  primaries: 3
  replicasPerPrimary: 1
  nodeTimeout: 5000
  # After scaling the StatefulSet, enable this once so the new ordinal joins.
  scaleJob:
    enabled: false
    ordinal: 3
    role: primary
    primaryOrdinal: 0

pdb:
  maxUnavailable: 1

# HorizontalPodAutoscaler is intentionally absent. See docs/cache-me-outside/kubernetes.md.
