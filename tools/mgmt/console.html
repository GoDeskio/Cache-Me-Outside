<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cache Me Outside console</title>
<style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#111}
input,button{font:inherit;padding:.4rem .6rem}button{cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:1rem}td,th{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
.box{background:#f4f6f8;border-radius:6px;padding:1rem;margin-top:1rem}code{word-break:break-all}
.err{color:#b00020}
</style></head><body>
<h1>Cache Me Outside</h1>
<p><label>Admin token <input id="tok" type="password" autocomplete="off" size="34"></label>
<button id="load">Load</button></p>
<form id="create"><label>New database name <input id="name" pattern="[a-z][a-z0-9-]{1,30}" required placeholder="my-app"></label>
<button>Create database</button></form>
<div id="result" class="box" hidden role="status"></div>
<p id="err" class="err" role="alert"></p>
<table><thead><tr><th>Name</th><th>Port</th><th>Ops/s</th><th>Conns</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<script>
"use strict";
const $=id=>document.getElementById(id);
const host=location.hostname;
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Authorization":"Bearer "+$("tok").value,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;
}
function show(db){
  const url=`redis://${encodeURIComponent(db.name)}:${encodeURIComponent(db.password)}@${host}:${db.port}`;
  const box=$("result");box.hidden=false;box.textContent="";
  const add=(label,text)=>{const p=document.createElement("p");p.append(label+" ");const c=document.createElement("code");c.textContent=text;p.append(c);box.append(p);};
  box.append(Object.assign(document.createElement("strong"),{textContent:`Database ${db.name} is ready. Copy the password now; it is shown once.`}));
  add("Connection URL:",url);
  add("CLI:",`valkey-cli -h ${host} -p ${db.port} --user ${db.name} --askpass`);
  add("Keys must start with:",db.name+":");
  const b=document.createElement("button");b.textContent="Copy URL";b.onclick=()=>navigator.clipboard.writeText(url);box.append(b);
}
async function load(){
  $("err").textContent="";
  try{
    const {databases}=await api("GET","/v1/databases");const tb=$("rows");tb.textContent="";
    for(const d of databases){
      const tr=tb.insertRow();for(const v of [d.name,d.port,d.ops_per_sec||"∞",d.max_conns||"∞"])tr.insertCell().textContent=v;
      const rot=document.createElement("button");rot.textContent="New password";
      rot.onclick=async()=>{if(confirm(`Replace the password for ${d.name}? The old one stops working.`)){try{show({...d,...await api("POST",`/v1/databases/${d.name}/rotate-password`,{})});}catch(e){$("err").textContent=e.message;}}};
      tr.insertCell().append(rot);
    }
  }catch(e){$("err").textContent=e.message;}
}
$("load").onclick=load;
$("create").onsubmit=async e=>{e.preventDefault();$("err").textContent="";
  try{show(await api("POST","/v1/databases",{name:$("name").value}));$("name").value="";load();}catch(x){$("err").textContent=x.message;}};
</script></body></html>
