name: Cache-Me-Outside

on:
  push:
  pull_request:

concurrency:
  group: cmo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Build and test subset
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config tcl tcl8.6 tclx

      - name: Build server
        run: make -j"$(nproc)" SERVER_CFLAGS='-Werror'

      - name: Run a fast Valkey test subset
        run: |
          # introspection is omitted: its forkless-bgsave case is timing-sensitive
          # on hosted runners and is unrelated to this fork's marker.
          ./runtest --dump-logs \
            --single unit/cmo-version \
            --single unit/auth \
            --single unit/acl \
            --single unit/protocol \
            --single unit/keyspace \
            --single unit/info

  image:
    name: Docker image and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prove tests cannot touch a default-project container
        run: |
          set -eu
          docker volume create cache-me-outside-data
          docker run -d --name cache-me-outside \
            -v cache-me-outside-data:/data \
            alpine:3.20 sleep 86400
          docker exec cache-me-outside sh -c 'echo keep-me > /data/marker'
          cd deploy
          # Refusal has to happen before any delete. These overrides name the
          # default project. The scripts must exit before they call down or kill.
          set +e
          env CMO_PROJECT=cache-me-outside CMO_NETWORK=cache-me-outside CMO_NAME_PREFIX=cache-me-outside \
            ./smoke.sh --no-up
          smoke_rc=$?
          env CMO_PROJECT=cache-me-outside CMO_NETWORK=cache-me-outside CMO_NAME_PREFIX=cache-me-outside \
            ./sentinel-failover.sh --no-up
          fail_rc=$?
          env CMO_PROJECT=cache-me-outside CMO_NETWORK=cache-me-outside CMO_NAME_PREFIX=cache-me-outside \
            ./cluster-scale-test.sh
          scale_rc=$?
          set -e
          test "$smoke_rc" -ne 0
          test "$fail_rc" -ne 0
          test "$scale_rc" -ne 0
          docker exec cache-me-outside cat /data/marker | grep -qx keep-me
          # A test-project down must not remove the stand-in volume or container.
          env CMO_PROJECT=cmo-test CMO_NETWORK=cmo-test CMO_NAME_PREFIX=cmo-test ./down.sh
          docker exec cache-me-outside cat /data/marker | grep -qx keep-me
          echo "CMO_PROJECT=cmo-test" >> "$GITHUB_ENV"
          echo "CMO_NETWORK=cmo-test" >> "$GITHUB_ENV"
          echo "CMO_NAME_PREFIX=cmo-test" >> "$GITHUB_ENV"

      - name: Build, standalone smoke, and a short benchmark
        run: |
          cd deploy
          ./smoke.sh --generate-env --mutate
          # The default smoke path must not raise memory or rewrite the env file.
          before_mem="$(docker inspect --format '{{.HostConfig.Memory}}' cmo-test)"
          before_env="$(grep '^CMO_MAXMEMORY=' .env)"
          admin_pass="$(grep '^CMO_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
          before_max="$(docker exec -e VALKEYCLI_AUTH="$admin_pass" cmo-test valkey-cli -h 127.0.0.1 -p 6379 --user admin --no-auth-warning CONFIG GET maxmemory | awk 'NR==2')"
          ./smoke.sh --no-up
          after_mem="$(docker inspect --format '{{.HostConfig.Memory}}' cmo-test)"
          after_env="$(grep '^CMO_MAXMEMORY=' .env)"
          after_max="$(docker exec -e VALKEYCLI_AUTH="$admin_pass" cmo-test valkey-cli -h 127.0.0.1 -p 6379 --user admin --no-auth-warning CONFIG GET maxmemory | awk 'NR==2')"
          test "$before_mem" = "$after_mem"
          test "$before_env" = "$after_env"
          test "$before_max" = "$after_max"
          CMO_BENCH_REQUESTS=10000 CMO_BENCH_CLIENTS=10 ./bench.sh
          docker image ls cache-me-outside:local
          ./down.sh

      - name: Sentinel failover
        run: |
          cd deploy
          CMO_REPLICAS=1 CMO_SENTINEL_DOWN_AFTER_MS=2000 CMO_SENTINEL_FAILOVER_TIMEOUT=20000 \
            ./smoke.sh --mutate sentinel
          ./sentinel-failover.sh --no-up
          ./down.sh

      - name: Cluster scale-out
        run: |
          cd deploy
          CMO_CLUSTER_PRIMARIES=3 CMO_CLUSTER_REPLICAS=0 ./cluster-scale-test.sh
          ./down.sh

      - name: Default-project stand-in is still intact
        run: |
          docker exec cache-me-outside cat /data/marker | grep -qx keep-me
          docker rm -f cache-me-outside
          docker volume rm cache-me-outside-data

  autocrlf:
    name: Image build with autocrlf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Refresh the worktree with core.autocrlf=true and build
        run: |
          set -eu
          git config core.autocrlf true
          git rm -rf --cached . >/dev/null
          git reset --hard
          python3 - <<'PY'
          import os, sys
          bad = []
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              for name in files:
                  path = os.path.join(root, name)
                  rel = path[2:] if path.startswith("./") else path
                  interesting = (
                      name == "Makefile"
                      or rel.startswith("src/")
                      or name.endswith(".tcl")
                      or name.endswith(".sh")
                      or rel.startswith("deploy/")
                  )
                  if not interesting:
                      continue
                  data = open(path, "rb").read()
                  if b"\r\n" in data or data.endswith(b"\r"):
                      bad.append(rel)
          if bad:
              print("CRLF line endings after autocrlf checkout:")
              print("\n".join(bad))
              sys.exit(1)
          PY
          docker build -t cache-me-outside:autocrlf .

  package:
    name: Debian package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and smoke inside Debian 12
        run: |
          # Compile in Bookworm so the binary does not need a newer glibc than the VM.
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm bash -lc '
            set -eu
            apt-get update
            apt-get install -y build-essential pkg-config python3 adduser ca-certificates iproute2
            make -C src distclean || true
            make -j"$(nproc)"
            ./packaging/build-deb.sh
            deb="$(basename "$(ls dist/cache-me-outside_*.deb)")"
            dpkg -i "dist/${deb}"
            CMO_SMOKE_RESET_ENV=1 /usr/lib/cache-me-outside/smoke-native.sh
            grep -q "^User=valkey" /lib/systemd/system/cache-me-outside.service
            grep -q "^ProtectSystem=strict" /lib/systemd/system/cache-me-outside.service
            grep -q "ExecStop=/usr/lib/cache-me-outside/cmo-shutdown" /lib/systemd/system/cache-me-outside.service
            test -x /usr/lib/cache-me-outside/cmo-join-cluster
            test -x /usr/lib/cache-me-outside/cmo-form-cluster
            /usr/lib/cache-me-outside/cmo-join-cluster
            chmod a+r "dist/${deb}"
          '

      - name: Publish the Debian package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cache-me-outside-deb
          path: dist/cache-me-outside_*.deb
          if-no-files-found: error

  k8s:
    name: Helm lint and kind smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install helm, kubeconform, and kind
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/kubeconform.tgz
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      - name: Lint and kubeconform
        run: |
          chart=deploy/helm/cache-me-outside
          helm lint "$chart"
          for topology in standalone sentinel cluster; do
            helm template cmo "$chart" --set "topology=${topology}" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
          done
          if helm template cmo "$chart" --set topology=standalone \
              | grep -q 'hostPort:'; then
            echo "default chart rendered a hostPort" >&2
            exit 1
          fi
          if helm template cmo "$chart" --set topology=standalone \
              --set hostPort.enabled=true --set hostPort.address=0.0.0.0 >/dev/null; then
            echo "chart accepted hostPort 0.0.0.0" >&2
            exit 1
          fi
          if helm template cmo "$chart" --set topology=cluster \
              --set cluster.announce.mode=ip >/dev/null; then
            echo "chart accepted announce ip without hostPort" >&2
            exit 1
          fi
          helm template cmo "$chart" \
            --set metrics.exporter.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.31.0 -skip ServiceMonitor
          if helm template cmo "$chart" | grep -Eq '^  name: (redis|valkey)$'; then
            echo "chart rendered a generic redis or valkey Service name" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]+- (redis|valkey)$' deploy/docker-compose.proxy-net.yml; then
            echo "proxy-net still advertises a generic alias" >&2
            exit 1
          fi

      - name: Build image and kind smoke
        run: |
          docker build -t cache-me-outside:local .
          kind create cluster --name cmo
          kind load docker-image cache-me-outside:local --name cmo
          kubectl create secret generic cache-me-outside-auth \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$(openssl rand -hex 24)" \
            --from-literal=app-user=app \
            --from-literal=app-password="$(openssl rand -hex 24)"
          helm upgrade --install cmo deploy/helm/cache-me-outside \
            --set image.pullPolicy=Never \
            --set image.repository=cache-me-outside \
            --set image.tag=local
          kubectl rollout status statefulset/cmo-cmo-data --timeout=180s
          kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 PING | grep -q NOAUTH
          pass="$(kubectl get secret cache-me-outside-auth -o jsonpath='{.data.admin-password}' | base64 -d)"
          kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 --user admin -a "$pass" --no-auth-warning INFO server \
            | grep -q 'cmo_version:.*-cmo'

      - name: Kind cluster scale-out
        run: |
          helm uninstall cmo --wait || true
          kubectl delete pvc -l app.kubernetes.io/instance=cmo --wait=true || true
          helm upgrade --install cmo deploy/helm/cache-me-outside \
            --set image.pullPolicy=Never \
            --set image.repository=cache-me-outside \
            --set image.tag=local \
            --set topology=cluster \
            --set cluster.primaries=3 \
            --set cluster.replicasPerPrimary=0 \
            --set resources.requests.memory=128Mi \
            --set resources.limits.memory=256Mi \
            --set resources.requests.cpu=50m \
            --set resources.limits.cpu=500m \
            --set maxmemory=64mb \
            --set persistence.size=64Mi \
            --wait --timeout 240s
          pass="$(kubectl get secret cache-me-outside-auth -o jsonpath='{.data.admin-password}' | base64 -d)"
          ready=0
          for _i in $(seq 1 30); do
            if kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 --user admin -a "$pass" --no-auth-warning CLUSTER INFO \
                | grep -q 'cluster_state:ok'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 --user admin -a "$pass" --no-auth-warning \
            SET cmo:kind before | grep -qx OK
          helm upgrade cmo deploy/helm/cache-me-outside \
            --reuse-values \
            --set cluster.primaries=4 \
            --set cluster.scaleJob.enabled=true \
            --set cluster.scaleJob.ordinal=3 \
            --set cluster.scaleJob.role=primary \
            --wait --timeout 300s
          masters="$(kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 --user admin -a "$pass" --no-auth-warning CLUSTER NODES | grep -c 'master' || true)"
          echo "masters=${masters}"
          test "$masters" -eq 4
          kubectl exec cmo-cmo-data-0 -- valkey-cli -h 127.0.0.1 -c --user admin -a "$pass" --no-auth-warning \
            GET cmo:kind | grep -qx before
