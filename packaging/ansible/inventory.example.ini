# Example only. 203.0.113.0/24 is TEST-NET-3 documentation space.
# Do not commit a real inventory. Passwords belong in an uncommitted
# group_vars file or an ansible-vault file that stays out of this repo.

[cmo]
node-a ansible_host=203.0.113.10 cmo_announce_ip=203.0.113.10 cmo_bind_address=203.0.113.10 cmo_role=cluster cmo_cluster_enabled=yes
node-b ansible_host=203.0.113.11 cmo_announce_ip=203.0.113.11 cmo_bind_address=203.0.113.11 cmo_role=cluster cmo_cluster_enabled=yes
node-c ansible_host=203.0.113.12 cmo_announce_ip=203.0.113.12 cmo_bind_address=203.0.113.12 cmo_role=cluster cmo_cluster_enabled=yes

[cmo:vars]
cmo_deb_path=/tmp/cache-me-outside.deb
# After the units are up, the second play runs cmo-form-cluster once.
cmo_form_cluster=yes
cmo_cluster_replicas=0
